name: dujiao

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    image: dujiao-api:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config.yml:/app/config.yml:ro
      - api_db:/app/db
      - api_uploads:/app/uploads
      - api_credentials:/app/credentials
      - api_logs:/app/logs
    ports:
      - "8080:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  user:
    build:
      context: ./user
    image: dujiao-user:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./user-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks: [internal]

  admin:
    build:
      context: ./admin
    image: dujiao-admin:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks: [internal]

volumes:
  redis_data:
  api_db:
  api_uploads:
  api_credentials:
  api_logs:

networks:
  internal:
    driver: bridge
